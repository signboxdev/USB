name: Publish deploy branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Check dist files
        run: |
          cd dist
          find . -type f -printf '%P\n' | LC_ALL=C sort > /tmp/dist-files

          # Fixed root assets and pages. Poster pages are checked separately so
          # new p/<slug>/index.html files can appear without updating this list.
          printf '%s\n' .htaccess apple-touch-icon.png coverflow.js favicon-32.png favicon.ico icon-512.png index.html logo.gif og-image.png robots.txt site.webmanifest sitemap.xml styles.css > /tmp/expected-files

          grep -E '^p/' /tmp/dist-files > /tmp/under-p || true
          # entries.json is written beside index.html only when that page is
          # large enough to stream its catalog instead of inlining it.
          if grep -Ev '^p/[a-z0-9]+/(index\.html|entries\.json)$' /tmp/under-p > /tmp/bad-p; then
            echo "unexpected paths under p/ (only p/<lowercase-slug>/index.html and entries.json are allowed):" >&2
            cat /tmp/bad-p >&2
            exit 1
          fi

          grep -Ev '^p/' /tmp/dist-files | grep -Ev '^entries\.json$' > /tmp/root-files
          diff -u /tmp/expected-files /tmp/root-files

      - name: Force-publish dist to deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          disable_nojekyll: true
